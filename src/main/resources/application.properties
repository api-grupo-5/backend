# Nombre de la app
spring.application.name=TechnoExpress - IT eCommerce

# Configuracion de base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/techno_express?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Configuracion de logs
logging.level.root=info
logging.level.techno_express.backend=INFO
logging.level.org.springframework.web=info
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=info
logging.level.org.springframework.security=info
# Configuracion general para debugear por si rompe algo
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Deshabilitar protecciÃÂ³n CSRF para endpoints API
spring.security.csrf.ignored-ant-matchers=/api/**
spring.security.debug=true

# Mailtrap SMTP (prueba gratuita en mailtrap.io)
