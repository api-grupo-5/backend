# ============================================
# Spring DataSource & JPA Configuration
# ============================================

# Use H2 in-memory database for development/testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate (JPA) settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# --------------------------------------------
# (Optional) H2 Console — access via browser:
# http://localhost:8080/h2-console
# --------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# Server Configuration
# ============================================
server.port=8080
# server.servlet.context-path=/api

# ============================================
# JWT & Security (example placeholders)
# ============================================
#spring.security.user.name=admin
#spring.security.user.password=secret

# ============================================
# Logging
# ============================================
logging.level.org.springframework=INFO
logging.level.techno_express.backend=DEBUG
