version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: techno_express_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: techno_express
      MYSQL_USER: techno_user
      MYSQL_PASSWORD: techno_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/sql/runThis.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - techno_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  # Spring Boot Application
  backend:
    build: .
    container_name: techno_express_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/techno_express?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: techno_user
      SPRING_DATASOURCE_PASSWORD: techno_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - techno_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  techno_network:
    driver: bridge 